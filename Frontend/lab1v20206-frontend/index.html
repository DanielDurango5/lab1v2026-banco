<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Banco - Lab1v20206</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        h1 { text-align: center; }
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tabs button {
            padding: 10px 20px; border: none; border-radius: 6px;
            background: #ccc; cursor: pointer; font-size: 15px;
        }
        .tabs button.active { background: #2c7be5; color: white; }
        .view { display: none; max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .view.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button.action { margin-top: 15px; padding: 10px 15px; background: #2c7be5; color: white; border: none; border-radius: 6px; cursor: pointer; }
        #transferMsg, #historicoMsg { margin-top: 10px; font-weight: bold; }

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-image: url('FondoUnibanco2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
<h1>Banco - Lab1v2026</h1>


<div class="tabs">
    <button id="btnClientes" class="active" onclick="mostrarVista('clientes')">Consultar clientes</button>
    <button id="btnTransferir" onclick="mostrarVista('transferir')">Transferir dinero</button>
    <button id="btnHistorico" onclick="mostrarVista('historico')">Histórico</button>
</div>

<!-- Vista 1: Clientes -->
<div id="clientes" class="view active">
    <h2>Clientes</h2>
    <table>
        <thead>
        <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Cuenta</th><th>Saldo</th></tr>
        </thead>
        <tbody id="tablaClientes"></tbody>
    </table>
</div>

<!-- Vista 2: Transferir -->
<div id="transferir" class="view">
    <h2>Transferir dinero</h2>
    <label>Cuenta remitente</label>
    <input type="text" id="senderAccount" placeholder="Ej: 200000">
    <label>Cuenta receptora</label>
    <input type="text" id="receiverAccount" placeholder="Ej: 100000">
    <label>Monto</label>
    <input type="number" id="amount" placeholder="Ej: 900" step="0.01">
    <button class="action" onclick="transferirDinero()">Transferir</button>
    <p id="transferMsg"></p>
</div>

<!-- Vista 3: Histórico -->
<div id="historico" class="view">
    <h2>Histórico de transacciones</h2>
    <label>Número de cuenta</label>
    <input type="text" id="cuentaHistorico" placeholder="Ej: 100000">
    <button class="action" onclick="consultarHistorico()">Consultar</button>
    <p id="historicoMsg"></p>
    <table>
        <thead>
        <tr><th>ID</th><th>Remitente</th><th>Receptor</th><th>Monto</th><th>Fecha</th></tr>
        </thead>
        <tbody id="tablaHistorico"></tbody>
    </table>
</div>



<script src="script.js"></script>
</body>
</html>
