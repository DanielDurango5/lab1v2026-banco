name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    # El proyecto Maven NO está en la raíz del repo, así que todos los
    # comandos "run" se ejecutan dentro de esta carpeta.
    defaults:
      run:
        working-directory: Backend/lab1v20206

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Backend/lab1v20206/pom.xml

      - name: Run tests
        run: mvn -B test